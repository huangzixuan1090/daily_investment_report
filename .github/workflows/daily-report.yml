name: 每日市场报告

on:
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      RECIPIENTS: ${{ secrets.RECIPIENTS }}

    steps:
      - uses: actions/checkout@v5

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 配置运行时参数
        run: |
          python3 << 'EOF'
          import json
          from pathlib import Path

          cfg = json.load(open("config.json"))

          # 覆盖敏感配置（使用 GitHub Secrets）
          import os
          cfg["llm"]["api"]["api_key"] = os.getenv("CLAUDE_API_KEY", cfg["llm"]["api"]["api_key"])
          cfg["mail"] = {
              "type": "smtp",
              "smtp_host": os.getenv("SMTP_HOST", cfg.get("mail", {}).get("smtp_host")),
              "smtp_port": int(os.getenv("SMTP_PORT", cfg.get("mail", {}).get("smtp_port", 587))),
              "smtp_user": os.getenv("SMTP_USER", cfg.get("mail", {}).get("smtp_user")),
              "smtp_password": os.getenv("SMTP_PASSWORD", cfg.get("mail", {}).get("smtp_password")),
              "from_addr": os.getenv("SMTP_USER", cfg.get("mail", {}).get("smtp_user")),
          }

          recipients = os.getenv("RECIPIENTS", "").split(",")
          cfg["recipients"] = [r.strip() for r in recipients if r.strip()]

          with open("config.json", "w") as f:
              json.dump(cfg, f, ensure_ascii=False, indent=2)

          print(f"✓ 已配置 {len(cfg['recipients'])} 个收件人")
          print(f"✓ SMTP: {cfg['mail']['smtp_host']}:{cfg['mail']['smtp_port']}")
          EOF

      - name: 生成每日报告
        run: |
          python daily_report.py

      - name: 上传报告到 S3（可选）
        if: always()
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$S3_BUCKET" ]; then
            echo "跳过 S3 上传（未配置 AWS_ACCESS_KEY_ID 或 S3_BUCKET）"
            exit 0
          fi

          pip install boto3 -q
          python3 << 'EOF'
          import json
          import os
          from pathlib import Path
          import boto3

          s3 = boto3.client('s3')
          bucket = os.getenv('S3_BUCKET')

          for report_file in Path('reports').glob('daily_report_*.html'):
              try:
                  s3.upload_file(
                      str(report_file),
                      bucket,
                      f"reports/{report_file.name}",
                      ExtraArgs={'ContentType': 'text/html; charset=utf-8'}
                  )
                  print(f"✓ 已上传: {report_file.name}")
              except Exception as e:
                  print(f"✗ 上传失败 {report_file.name}: {e}")
          EOF

      - name: 上传失败日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: |
            reports/SEND_FAILED_*.flag
            *.log
          retention-days: 7
